<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
	<div class="row">
		<div class="col"><hr/></div>
	</div>	
	<div class="row m-1">
		<h3 id="reviewSection">Customer reviews:</h3>
	</div>
	<div class="row m-1 align-items-center">
		<div class="col-xs">
			<input type="text" class="product-detail-rating-star" data-size="md" dir="ltr"
			th:value="${product.averageRating}"/>
		</div>
		<div class="col-xs ml-1 mt-3">
			<span id="ratingNumber">[[${product.averageRating}]]</span> of 5
		</div>
	</div>
	<div class="row m-1 ml-3">
		<a th:href="@{'/ratings/' + ${product.alias}}">View all [[${product.reviewCount}]] ratings</a>
	</div>
	
	<div th:if="${customerReviewed}" class="row m-1 ml-3">
		<span>You already reviewed this product.</span>
	</div>
	
	<div th:if="${customerCanReview}" class="row m-1 ml-3">
		<span class="text-info">You purchased and got this product
			<b>
				<a th:href="@{'/write_review/product/' + ${product.id}}">Write your review now</a>
			</b>
			
		</span>
	</div>
	<div class="row">
		<div class="col"><hr/></div>
	</div>	
	
	<div class="row m-2">
		<div class="col">
			<th:block th:each="review: ${reviews}">
				<div class="row">
					<div class="col-xs">
						<input type="text" class="product-detail-rating-star" data-size="xs" dir="ltr"
									th:value="${product.averageRating}"/>
					</div>
				</div>
				<div class="row">
					<div class="col">
						<b>[[${review.headline}]]</b>
					</div>
				</div>
				<div class="row">
					<div class="col">
						<b>[[${review.comment}]]</b>
					</div>
				</div>
				<div class="row">
					<div class="col">
						<small class="ml-3">[[${review.customer.fullName}]],
							<div th:replace="fragments::format_time(${review.reviewTime})"></div>
						</small>
					</div>
				</div>
				<div class="row">
					<div class="col"><hr/></div>
				</div>	
			</th:block>
		</div>
	</div>
</div> 
</body>
</html>
