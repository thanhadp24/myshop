<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<head th:replace="fragments:: page_head('Sale report', 'none')" />
</head>

<body>
	
<div class="container-fluid">
	<div th:replace="navigation:: navbar"></div>
	<div>
		<h2 class="text-secondary">Sale Report</h2>
	</div>
	
	<div th:replace="fragments:: message"></div>
	
	<!-- tab-header -->
	<ul class="nav nav-tabs" id="settingTab" role="tablist">
		<li class="nav-item"><a class="nav-link active"
			data-toggle="tab" href="#date" role="tab">Sales By Date</a></li>
		<li class="nav-item"><a class="nav-link" 
		data-toggle="tab" href="#category" role="tab"
		>Sales By Category</a></li>
		<li class="nav-item"><a class="nav-link" 
		data-toggle="tab" href="#product" role="tab"
		>Sales By Product</a></li>
	</ul>

	<!-- tab-panels -->
	<div class="tab-content">
		<div class="tab-pane active p-3" id="date" role="tabpanel">
			<div th:replace="reports/sales_report_fragments::content('_date')"></div>
		</div>
		<div class="tab-pane p-3" id="category" role="tabpanel">
			<div th:replace="reports/sales_report_fragments::content('_category')"></div>
		</div>
		<div class="tab-pane p-3" id="product" role="tabpanel">
			<div th:replace="reports/sales_report_fragments::content('_product')"></div>
		</div>
	</div>
	
	<div class="toast d-flex justify-content-center ml-3" role="alert" aria-live="polite" aria-atomic="true" data-delay="3000">
	  <div role="alert" aria-live="assertive" aria-atomic="true">
	  	<div class="toast-body">
	  		<div id="toastMessage"></div>
	  	</div>
	  </div>
	</div>
	
	<div th:replace="fragments:: footer"></div>
</div>
 <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
<script>
	contextPath = "[[@{/}]]";
	currencySymbol = "[[${CURRENCY_SYMBOL}]]";
	thousandPointType = "[[${THOUSANDS_POINT_TYPE == 'COMMA'? ',':'.'}]]"
	decimalPointType = "[[${DECIMAL_POINT_TYPE == 'COMMA'? ',':'.'}]]"
	currencySymbolPosition = "[[${CURRENCY_SYMBOL_POSITION}]]";
	decimalDigits = "[[${DECIMAL_DIGITS}]]";
	
	prefixCurrencySymbol = currencySymbolPosition == 'before price' ? currencySymbol : ''
	suffixCurrencySymbol = currencySymbolPosition == 'after price' ? currencySymbol : ''
	
	$(document).ready(function(){
		google.charts.load('current', {'packages':['corechart', 'table']});
		google.charts.setOnLoadCallback(loadSalesReportByDate("last_7_days"));
	})
	
</script>
<script th:src="@{/js/sales_report_common.js}"></script>
<script th:src="@{/js/sales_report_by_date.js}"></script>
<script th:src="@{/js/sales_report_by_category.js}"></script>
<script th:src="@{/js/sales_report_by_product.js}"></script>
<script th:src="@{/js/jquery.number.min.js}"></script>
</body>
</html>
