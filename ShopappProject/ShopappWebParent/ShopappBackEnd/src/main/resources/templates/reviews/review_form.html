<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" >

<head th:replace="fragments:: page_head(${pageTitle}, 'none')" />
<body>
<div class="container-fluid">
	<div th:replace="navigation:: navbar"></div>

	<div>
		<h2>Manage review | [[${pageTitle}]]</h2>
	</div>
	
	<form th:action="@{/reviews/save}" th:object="${review}" method="post"
	style="max-width: 800px; margin: 0 auto;">
		<input type="hidden" th:field="*{id}"/>
		<div class="border border-secondary rounded p-3">
			<div class="form-group row">
				<label class="col-sm-2 col-form-label">Product:</label>
				<div class="col-sm-10">
					<input type="text" readonly class="form-control" th:value="${review.product.name}"/>
				</div>
			</div>
			
			<div class="form-group row">
				<label class="col-sm-2 col-form-label">Customer</label>
				<div class="col-sm-10">
					<input type="text" readonly class="form-control" th:value="${review.customer.fullName}"/>
				</div>
			</div>
			
			<div class="form-group row">
				<label class="col-sm-2 col-form-label">Headline</label>
				<div class="col-sm-10">
					<input type="text" class="form-control" th:field="*{headline}" minlength="20"
					maxlength="128" required/>
				</div>
			</div>
			<div class="form-group row">
				<label class="col-sm-2 col-form-label">Comment</label>
				<div class="col-sm-10">
					<textarea rows="3" class="form-control" th:field="*{comment}" minlength="20"
					maxlength="500" required>
					</textarea>
				</div>
			</div>
			<div class="text-center">
				<input type="submit" value="Save" class="btn btn-primary m-3" />
				<input type="button" value="Cancel" class="btn btn-warning m-3" id="btn-cancel" />
			</div>
		</div>
	</form>
	
	<div th:replace="modal_fragments:: modal_dialog"></div>
	<div th:replace="fragments:: footer"></div>
</div>	
<script th:src="@{/js/common_form.js}"></script>
<script>
	moduleURL = "[[@{/reviews}]]"
</script>
</body>
