<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmln:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head th:replace="fragments:: page_head('Reviews', 'none')">
</head>

<body>

	<div class="container-fluid">
		<div th:replace="navigation:: navbar"></div>

		<div>
			<h2>Manage Reviews</h2>
		</div>


		<div th:replace="fragments:: message"></div>
		<div th:replace="fragments:: search"></div>
		
		<div class="full-details">
			<table class="table table-responsive-xl table-bordered table-hover table-striped">
				<thead>
					<tr>
						<th th:replace="fragments:: column_link('id', 'ID', 'none')"></th>
						<th th:replace="fragments:: column_link('product', 'Product', 'none')"></th>
						<th th:replace="fragments:: column_link('customer', 'Customer', 'none')"></th>
						<th th:replace="fragments:: column_link('rating', 'Rating', 'none')"></th>
						<th th:replace="fragments:: column_link('reviewTime', 'Review Time', 'none')"></th>
						<th>Action</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="review: ${reviews}">
						<td>[[${review.id}]]</td>
						<td>
							<a th:href="@{'/products/detail/' + ${review.product.id}}" class="link-detail-product">
								[[${review.product.shortName}]]
							</a>
						</td>
						<td>
							<a th:href="@{'/customers/detail/' + ${review.customer.id}}" class="link-detail-customer">
								[[${review.customer.fullName}]]
							</a>
						</td>
						<td>[[${review.rating}]] <i class="fa fa-star text-warning"></i></td>
						<td>[[${review.reviewTime}]]</td>
						<td>
							<a class="fa-regular fa-file fa-lg icon-green link-detail-review" 
							th:href="@{'/reviews/detail/' + ${review.id}}"
							title="View detail of this review"></a> &nbsp;
							<div th:replace="fragments:: entity_edit('/reviews/edit/' + ${review.id}, 
							'review')"></div>&nbsp;
							<div th:replace="fragments:: entity_delete('/reviews/delete/' 
							+ ${review.id}, 'review', ${review.id}, true)"></div>
						</td>
					</tr>
				</tbody>
			</table>
		</div>
		
		<div class="less-details">
			<div class="row m-1" th:each="review: ${reviews}">
				<div class="col-2">
					<span>[[${review.id}]]</span>
				</div>
				<div class="col-10">
					<div>
						<span>[[${review.product.shortName}]]</span>
					</div>
					<div>
						<span>[[${review.rating}]] <i class="fa fa-star"></i></span>&nbsp;
						<a class="fa-regular fa-file fa-lg icon-green link-detail-review" 
							th:href="@{'/reviews/detail/' + ${review.id}}"
							title="View detail of this review"></a> &nbsp;
						<div th:replace="fragments:: entity_edit('/reviews/edit/' + ${review.id}, 
						'review')"></div>&nbsp;
						<div th:replace="fragments:: entity_delete('/reviews/delete/' 
						+ ${review.id}, 'review', ${review.id}, true)"></div>
					</div>
				</div>
			</div>
		</div>


		<div th:replace="fragments:: pagination('reviews')"></div>

		<div th:replace="modal_fragments:: modal_confirm"></div>
		
		<div class="modal fade" id="xLargeModal">
			<div class="modal-dialog modal-xl">
				<div class="modal-content"></div>
			</div>
		</div>
		
		<div class="modal fade" id="largeModal">
			<div class="modal-dialog modal-lg">
				<div class="modal-content"></div>
			</div>
		</div>
		
		<div th:replace="fragments:: footer"></div>
	</div>

</body>
<script th:src="@{/js/common_link.js}"></script>
<script>
	moduleURL = "[[@{/reviews}]]"
	
	$(document).ready(function(){
		handleDeleteLink();
		handleProductDetailLink();
		handleCustomerDetailLink();
		handleReviewDetailLink();
	})
	
	function handleDeleteLink(){
		$(".link-delete").on('click', function(e){
			e.preventDefault();
			confirmDeleteModal($(this), 'review');
		})
	}
	
	function handleDetailLinkClick(cssClass, modalId){
		$(cssClass).on("click", function(e){
			e.preventDefault();
			linkDetailUrl = $(this).attr("href");
			$(modalId).modal("show").find(".modal-content").load(linkDetailUrl);
		})
	}
	
	function handleProductDetailLink(){
		handleDetailLinkClick(".link-detail-product", "#xLargeModal")
	}
	
	function handleCustomerDetailLink(){
		handleDetailLinkClick(".link-detail-customer", "#largeModal")
	}
	
	function handleReviewDetailLink(){
		handleDetailLinkClick(".link-detail-review", "#largeModal")
	}
	
</script>
</html>
